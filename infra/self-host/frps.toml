# frps：运行在 VPS 的 compose 里，配置不需要改。token 从 .env 的 FRP_AUTH_TOKEN 读取。
bindPort = 7000

auth.method = "token"
auth.token = "{{ .Envs.FRP_AUTH_TOKEN }}"

# 只允许家里的 frpc 占用 7001 这一个端口，别的 remotePort 一律拒绝。
allowPorts = [{ single = 7001 }]

# frpc 与 frps 之间强制 TLS：VPS 和家之间的这一段也不走明文。
transport.tls.force = true

log.to = "console"
log.level = "info"
