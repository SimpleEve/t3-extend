# frps behind Caddy. Nothing here is published to the host.
# Who may log in, open a proxy or keep a connection is decided by the registry plugin on every call.
bindPort = 7000
vhostHTTPPort = 8080
subDomainHost = "{{ .Envs.T3X_DOMAIN }}"
transport.heartbeatTimeout = 90

log.to = "console"
log.level = "info"

[[httpPlugins]]
name = "t3x-registry"
addr = "registry:8081"
path = "/frps"
ops = ["Login", "NewProxy", "Ping", "NewWorkConn"]
