name: T3 Extend release

# T3 Extend's own release pipeline; the upstream workflows next to it are disabled on GitHub and
# stay byte-identical to upstream. See FORK.md "打包与签名".
#
#   git tag v0.1.11-1.0 && git push origin v0.1.11-1.0 -> publishes the release (v<upstream>-<fork>)
#   v0.0.0-ci.N tag, or a manual run            -> a draft prerelease for testing, never offered to t3x update
#
# Builds, all on GitHub-hosted runners:
#   t3-<version>-<platform>-<arch>.tar.gz   t3x CLI for macOS arm64, Linux x64, Linux arm64, plus SHA256SUMS
#   T3-Extend-<version>-arm64.dmg           macOS app, signed with the fork's self-signed identity
#   T3-Extend-<version>-arm64.zip           the same app zipped for Squirrel.Mac, and latest-mac.yml naming it
#   T3-Extend-<version>-x64.exe             Windows app (NSIS installer), unsigned, with .blockmap and latest.yml
#   T3-Extend-<app version>-arm64-v8a.apk   Android app, signed with the fork's release keystore
# The release stays a draft until every asset is attached, so `t3x update` never sees half a release.
# The release body is docs/fork/changelog/<version>.md (中文 + English) plus a short download list; a published
# tag fails in the plan job, before any build, if that file is missing or unfinished. See deploy/release.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Test version, like 0.0.0-ci.1. Empty means 0.0.0-ci.<run number>. A manual run never publishes.
        required: false
        default: ""
        type: string

# One release at a time across tags: `t3x update` takes the newest-created release, so a lower
# version must never be published after a higher one.
concurrency:
  group: fork-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The fork has no telemetry channel of its own; builds outside upstream report "dev".
  T3CODE_TELEMETRY_CHANNEL: dev
  # The self-signed identity every DMG must carry, so an update keeps the Keychain grants users gave
  # earlier builds. It is the certificate's SHA-1, public by nature.
  EXPECTED_MAC_CERT_SHA1: 491ecedb5b04161e40395baec9349b5641488978
  # The desktop builds bake this feed into app-update.yml, so an installed app updates itself from
  # this repository's releases. Explicit on purpose: the build never infers a feed from the CI repository.
  T3CODE_DESKTOP_UPDATE_REPOSITORY: SimpleEve/t3-extend

jobs:
  plan:
    name: Resolve version
    if: github.repository == 'SimpleEve/t3-extend'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
      fork: ${{ steps.release.outputs.fork }}
      android_version_code: ${{ steps.release.outputs.android_version_code }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # A test build without a changelog file drafts one from git history; a published tag only reads the file.
          fetch-depth: ${{ github.event_name == 'push' && !contains(github.ref, '-ci.') && 1 || 0 }}
          sparse-checkout: |
            package.json
            scripts/fork-release-version.ts
            scripts/fork-release-changelog.ts
            scripts/fork-changelog-draft.ts
            docs/fork/changelog
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json

      - id: release
        name: Resolve version, tag and whether to publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Drafts are not offered by `t3x update`, so only published tags constrain the new one.
          PUBLISHED_TAGS="$(gh release list --limit 1000 --json tagName,isDraft --jq '.[] | select(.isDraft | not) | .tagName')"
          export PUBLISHED_TAGS
          node scripts/fork-release-version.ts \
            --event-name "$GITHUB_EVENT_NAME" \
            --ref "$GITHUB_REF" \
            --dispatch-version "${DISPATCH_VERSION:-}" \
            --run-number "$GITHUB_RUN_NUMBER"

      # Fails a published tag with no finished changelog now, not after an hour of builds.
      - name: Prepare the changelog
        env:
          VERSION: ${{ steps.release.outputs.version }}
          PUBLISH: ${{ steps.release.outputs.publish }}
        run: node scripts/fork-release-changelog.ts --version "$VERSION" --publish "$PUBLISH" --out changelog.md

      - name: Upload the changelog
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: changelog
          path: changelog.md
          if-no-files-found: error
          retention-days: 1

  bundle:
    name: Build JS bundle
    needs: plan
    if: github.repository == 'SimpleEve/t3-extend'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      # The server reads its version from its manifest, so every build aligns them to the tag first.
      - name: Align package versions to the release version
        run: node scripts/update-release-package-versions.ts "${{ needs.plan.outputs.version }}"

      - name: Build JS bundle
        run: vp run build:desktop:bundle

      # fork: upload-artifact skips hidden files, so the web asset manifest travels under a plain name
      # (same as upstream release.yml, #42806); the CLI job puts it back.
      - name: Stage web asset manifest
        shell: bash
        run: |
          manifest=apps/server/dist/client/.vite/manifest.json
          if [[ -f "$manifest" ]]; then
            cp "$manifest" apps/server/dist/client/vite-manifest.release.json
          fi

      # Two paths under apps/ so the artifact root is apps/; consumers download into `apps`.
      - name: Upload JS bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  cli:
    name: t3x CLI ${{ matrix.key }}
    needs: [plan, bundle]
    if: github.repository == 'SimpleEve/t3-extend'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: mac
            arch: arm64
            key: darwin-arm64
            rust_target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            key: linux-x64
            rust_target: x86_64-unknown-linux-gnu
          # node-pty has no Linux prebuild and compiles from source, so arm64 builds on arm64 hardware.
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            key: linux-arm64
            rust_target: aarch64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Align package versions to the release version
        run: node scripts/update-release-package-versions.ts "${{ needs.plan.outputs.version }}"

      # The artifact root is `apps/`, so this restores apps/server/dist and apps/desktop/dist-electron.
      - name: Download JS bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: js-bundle
          path: apps

      - name: Restore web asset manifest
        shell: bash
        run: |
          client=apps/server/dist/client
          if [[ -f "$client/vite-manifest.release.json" ]]; then
            mkdir -p "$client/.vite"
            mv "$client/vite-manifest.release.json" "$client/.vite/manifest.json"
          fi

      - name: Apply web client branding
        run: node scripts/apply-web-brand-assets.ts production apps/server/dist/client

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.rust_target }}

      - name: Build resource monitor
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target "${{ matrix.rust_target }}"

      - name: Build CLI single-executable
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Stage resource monitor for the CLI archive
        run: |
          set -euo pipefail
          target_dir="$RUNNER_TEMP/cli-resource-monitor/${{ matrix.key }}"
          mkdir -p "$target_dir"
          cp "native/resource-monitor/target/${{ matrix.rust_target }}/release/t3-resource-monitor" "$target_dir/"

      # The Linux archive ships libatomic.so.1 and points t3's RUNPATH at it.
      - name: Install patchelf
        if: matrix.platform == 'linux'
        run: command -v patchelf || { sudo apt-get update && sudo apt-get install -y patchelf; }

      # No signing identity is set, so the macOS archive is signed ad hoc, which Apple silicon accepts.
      - name: Build CLI archive
        run: |
          node scripts/build-cli-archive.ts \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --version "${{ needs.plan.outputs.version }}" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-cli

      - name: Smoke-test CLI archive
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "${{ needs.plan.outputs.version }}"

      - name: Upload CLI archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.key }}
          path: release-cli/*
          if-no-files-found: error
          # Already gzip; deflating again saves under 2%.
          compression-level: 0

  dmg:
    name: macOS DMG
    needs: plan
    if: github.repository == 'SimpleEve/t3-extend'
    # The Apple Speech helper needs the macOS 26 SDK (Xcode 26), which macos-15 does not have.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      # fork-dist-mac.ts compiles the resource monitor with this toolchain (sysinfo needs rustc 1.95).
      - name: Install Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal

      # The identity goes into a throwaway keychain that is put on the search list, where fork-dist-mac.ts
      # looks for "T3 Extend Code Signing". Only codesign may use the key.
      - name: Import the signing identity
        env:
          P12_BASE64: ${{ secrets.T3EXTEND_MAC_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.T3EXTEND_MAC_CERT_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$P12_BASE64" || -z "$P12_PASSWORD" ]]; then
            echo "::error::T3EXTEND_MAC_CERT_P12_BASE64 / T3EXTEND_MAC_CERT_P12_PASSWORD are not set."
            exit 1
          fi
          keychain="$RUNNER_TEMP/t3x-signing.keychain-db"
          p12="$RUNNER_TEMP/t3x-identity.p12"
          # The final cleanup step deletes the keychain even if a later line here fails.
          echo "T3EXTEND_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          trap 'rm -f "$p12"' EXIT
          keychain_secret="$(openssl rand -hex 16)"
          echo "::add-mask::$keychain_secret"
          (umask 077 && printf '%s' "$P12_BASE64" | base64 --decode > "$p12")
          security create-keychain -p "$keychain_secret" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_secret" "$keychain"
          security import "$p12" -k "$keychain" -P "$P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_secret" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$keychain"

      - name: Align package versions to the release version
        run: node scripts/update-release-package-versions.ts "${{ needs.plan.outputs.version }}"

      - name: Build, sign and verify the DMG
        run: vp run fork:dist:mac

      # A different certificate would make macOS ask users again for the Keychain items they allowed.
      - name: Check the signing identity of the DMG
        run: |
          set -euo pipefail
          dmg="$(ls release/fork-mac/*.dmg)"
          codesign -dv --verbose=4 "$dmg" 2>&1 | grep -E '^(Identifier|Authority|Format)' || true
          mount_point="$(mktemp -d)"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_point" "$dmg" >/dev/null
          trap 'hdiutil detach "$mount_point" >/dev/null || true' EXIT
          app="$(ls -d "$mount_point"/*.app)"
          requirement="$(codesign -d -r- "$app" 2>&1)"
          echo "$requirement"
          expected="certificate root = H\"$EXPECTED_MAC_CERT_SHA1\""
          if [[ "$requirement" != *"$expected"* ]]; then
            echo "::error::The app's designated requirement does not name the expected certificate."
            exit 1
          fi

      - name: Remove the signing keychain
        if: always()
        run: |
          if [[ -n "${T3EXTEND_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$T3EXTEND_SIGNING_KEYCHAIN" || true
          fi

      - name: Upload DMG
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmg
          path: |
            release/fork-mac/*.dmg
            release/fork-mac/*.dmg.sha256
            release/fork-mac/*.zip
            release/fork-mac/latest-mac.yml
          if-no-files-found: error
          compression-level: 0

  exe:
    name: Windows installer
    needs: plan
    if: github.repository == 'SimpleEve/t3-extend'
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      # pnpm's store paths and the staged app run long on Windows.
      - name: Allow long paths
        shell: pwsh
        run: git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.95.0
          targets: x86_64-pc-windows-msvc

      # Built here so the packager can skip its own Visual Studio probe, which asks for Spectre libraries.
      - name: Build resource monitor
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Align package versions to the release version
        run: node scripts/update-release-package-versions.ts "${{ needs.plan.outputs.version }}"

      # There is no Windows certificate, so the installer is unsigned and SmartScreen shows "Unknown publisher".
      # The script unpacks the installer afterwards and checks the app name, frpc and the bundled server.
      - name: Build and check the installer
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: "true"
        run: vp run fork:dist:win

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exe
          path: |
            release/fork-win/*.exe
            release/fork-win/*.exe.blockmap
            release/fork-win/*.exe.sha256
            release/fork-win/latest.yml
          if-no-files-found: error
          compression-level: 0

  apk:
    name: Android APK
    needs: plan
    if: github.repository == 'SimpleEve/t3-extend'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      # The Android build needs the room; the runner ships toolchains this job never uses.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          # The build script lives in the scripts workspace and imports @t3tools/shared.
          install-args: --filter=@t3tools/mobile... --filter=@t3tools/scripts...

      # JBR 21 is what FORK.md's local setup builds with.
      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21

      # Versions follow react-native/gradle/libs.versions.toml, as in FORK.md "Android 开发环境".
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" --install "platforms;android-37.0" "platforms;android-36" "build-tools;37.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Build and sign the APK
        env:
          KEYSTORE_BASE64: ${{ secrets.T3EXTEND_ANDROID_KEYSTORE_BASE64 }}
          T3EXTEND_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.T3EXTEND_ANDROID_KEYSTORE_PASSWORD }}
          # Do not reach for a shared native-client cache; this build is its own.
          T3_NATIVE_CLIENT_CACHE: "off"
          # Empty for a test build, which keeps the app's own version and versionCode.
          T3EXTEND_RELEASE_FORK: ${{ needs.plan.outputs.fork }}
          T3EXTEND_ANDROID_VERSION_CODE: ${{ needs.plan.outputs.android_version_code }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$T3EXTEND_ANDROID_KEYSTORE_PASSWORD" ]]; then
            echo "::error::T3EXTEND_ANDROID_KEYSTORE_BASE64 / T3EXTEND_ANDROID_KEYSTORE_PASSWORD are not set."
            exit 1
          fi
          keystore="$RUNNER_TEMP/android-release.jks"
          trap 'rm -f "$keystore"' EXIT
          (umask 077 && printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore")
          export T3EXTEND_ANDROID_KEYSTORE="$keystore"
          vp run fork:dist:android

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk
          path: |
            release/fork-android/*.apk
            release/fork-android/*.apk.sha256
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: [plan, cli, dmg, exe, apk]
    if: github.repository == 'SimpleEve/t3-extend'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      PUBLISH: ${{ needs.plan.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            package.json
            scripts/fork-check-update-feeds.ts
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json

      - name: Download the changelog
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: changelog
          path: changelog

      - name: Download CLI archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets

      - name: Download DMG
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dmg
          path: release-assets

      - name: Download Windows installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: exe
          path: release-assets

      - name: Download APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk
          path: release-assets

      # `t3x update` and install-t3x.sh verify archives against this file, so it is written from the
      # exact bytes that get uploaded. The platform list matches CLI_ARCHIVE_PLATFORM_KEYS in cliRelease.ts.
      - name: Write CLI archive checksums
        working-directory: release-assets
        run: |
          set -euo pipefail
          for key in darwin-arm64 linux-arm64 linux-x64; do
            [[ -f "t3-${VERSION}-${key}.tar.gz" ]] || { echo "::error::t3-${VERSION}-${key}.tar.gz is missing."; exit 1; }
          done
          sha256sum t3-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          ls -l

      # The manifests an installed app reads must name assets that exist here, byte for byte.
      - name: Check the update manifests against the assets
        run: node scripts/fork-check-update-feeds.ts --dir release-assets --version "${VERSION}"

      - name: Write release notes
        run: |
          {
            if [[ "$PUBLISH" != "true" ]]; then
              echo "> **测试构建 / Test build.** 由 CI 构建，用来检查发布流程；\`t3x update\` 不会提供它。Built by CI to check the release pipeline; \`t3x update\` never offers it."
              echo
            fi
            cat changelog/changelog.md
            echo
            echo "## 下载 / Downloads"
            echo
            echo "版本号里短横线前是所基于的上游 T3 Code 版本，后面是 T3 Extend 自己的版本号。The part before the dash is the upstream T3 Code release it is built on; the part after is T3 Extend's own."
            echo
            echo "- \`T3-Extend-*-arm64.dmg\`: macOS 应用（Apple 芯片），首次启动提示见 docs/user/install.md / macOS app (Apple silicon), first-launch prompts in docs/user/install.md."
            echo "- \`T3-Extend-*-x64.exe\`: Windows 安装包（x64，未签名，SmartScreen 会提示“未知发布者”）/ Windows installer (x64, unsigned; SmartScreen says \"Unknown publisher\")."
            echo "- \`T3-Extend-*-arm64-v8a.apk\`: Android 应用 / Android app."
            echo "- \`t3-${VERSION}-<platform>-<arch>.tar.gz\`, \`SHA256SUMS\`: \`t3x\` 命令行（macOS arm64、Linux x64、Linux arm64）/ the \`t3x\` command line for macOS arm64, Linux x64 and Linux arm64."
            echo "- \`latest-mac.yml\`, \`latest.yml\`, \`*.zip\`, \`*.blockmap\`: 桌面版自动更新用，不需要手动下载 / used by the desktop app's updater, not for download."
            echo
            echo "不装桌面版，只装 \`t3x\` / Install \`t3x\` without the desktop app:"
            echo
            echo '```sh'
            echo "curl -fsSL https://raw.githubusercontent.com/${GH_REPO}/${TAG}/scripts/install-t3x.sh | T3X_VERSION=${VERSION} sh"
            echo '```'
          } > release-notes.md

      # A rerun replaces its own unfinished draft; a published release is never touched.
      - name: Remove an unfinished draft of this tag
        run: |
          set -euo pipefail
          state="$(gh release list --limit 200 --json tagName,isDraft --jq ".[] | select(.tagName == \"$TAG\") | .isDraft")"
          if [[ "$state" == "true" ]]; then
            gh release delete "$TAG" --yes
          elif [[ "$state" == "false" ]]; then
            echo "::error::$TAG is already published."
            exit 1
          fi

      - name: Create the release as a draft and attach every asset
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tagged="$(gh api "repos/${GH_REPO}/commits/refs/tags/${TAG}" --jq .sha)"
            if [[ "$tagged" != "$GITHUB_SHA" ]]; then
              echo "::error::$TAG now points at $tagged, but this run built $GITHUB_SHA."
              exit 1
            fi
          fi
          args=(--draft --title "T3 Extend ${VERSION}" --notes-file release-notes.md)
          if [[ "$PUBLISH" != "true" ]]; then args+=(--prerelease); fi
          # An existing tag (a tag push) must be the one this run built.
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then args+=(--verify-tag); else args+=(--target "$GITHUB_SHA"); fi
          shopt -s nullglob
          gh release create "$TAG" release-assets/* "${args[@]}"

      # Only now can `t3x update` see it: every asset it downloads is already there.
      - name: Publish
        if: needs.plan.outputs.publish == 'true'
        run: gh release edit "$TAG" --draft=false --latest
